services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Run pnpm setup:env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run pnpm setup:env}
      POSTGRES_DB: ${POSTGRES_DB:-teenaitook}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
